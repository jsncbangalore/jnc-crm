# =============================================================================
# GitHub Actions CI Workflow: Continuous Integration & Deploy Safety
# =============================================================================
# SECRETS DOCUMENTATION:
# Required Secrets: NONE (0 secrets required for tests or release verification).
# The CI runner provisions an ephemeral local PostgreSQL service container
# (localhost:5432) so that unit, integration, and release safety tests execute
# with zero external dependencies, live credentials, or live databases.
# =============================================================================

name: CI & Deploy Safety Verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Release Safety Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jnc_crm_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jnc_crm_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jnc_crm_dev?schema=public
      JWT_SECRET: dev-secret-minimum-32-characters-test-key-2026
      JWT_REFRESH_SECRET: dev-refresh-secret-minimum-32-characters-key-2026
      OTP_SECRET: dev-otp-secret-minimum-32-characters-test-key-2026
      ENCRYPTION_KEY: dXNlcl9zZWNyZXRfa2V5XzMyX2J5dGVzX2Jhc2U2NF9f # 32-byte test key
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      VITE_API_URL: https://api.jsnc.co.in/api/v1
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run postinstall

      - name: Deploy Migrations to CI PostgreSQL
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Verify Zero Schema Drift (schema.prisma vs migrations)
        run: npm run check:schema-drift

      - name: Seed Initial Test Data
        run: npm run seed

      - name: Code Linting (if present)
        run: npm run lint --if-present

      - name: Build API and Web Applications
        run: npm run build

      - name: Run Full Test Suite (npm run test:all)
        run: npm run test:all

      - name: Run Deploy Safety & Release Verification (npm run release:verify)
        run: npm run release:verify
